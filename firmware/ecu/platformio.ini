[platformio]
default_envs = ecu-normal

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    lvgl/lvgl@8.4.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DCORE_DEBUG_LEVEL=0

[env:ecu-normal]

[env:ecu-maintenance]
build_flags = ${env.build_flags} -DNGK_SD_MAINTENANCE=1
